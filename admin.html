<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MeubLuxe Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f3ef;color:#181818}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center}
.box{background:#fff;width:400px;max-width:90%;padding:30px;border-radius:18px;box-shadow:0 10px 35px #0002}
.logo{font:700 30px Georgia;margin-bottom:25px}
.logo span{color:#c89143}
input{width:100%;padding:13px;margin:8px 0 14px;border:1px solid #ddd;border-radius:9px}
button{border:0;border-radius:9px;padding:13px 18px;cursor:pointer;font-weight:bold}
.loginBtn{width:100%;background:#c89143;color:#fff}
.error{color:#c00;margin-top:12px}
.dashboard{display:none;padding:30px}
.top{max-width:1000px;margin:auto;display:flex;justify-content:space-between;align-items:center}
.card{max-width:1000px;margin:25px auto;background:#fff;padding:25px;border-radius:15px}
.logout{background:#111;color:#fff}
.vendor{border:1px solid #ddd;padding:15px;border-radius:10px;margin:10px 0}
.delete{background:#eee;color:#b00}
</style>
</head>

<body>

<div class="login" id="resetPage" style="display:none">
  <div class="box">
    <div class="logo">Meub<span>Luxe</span></div>
    <h2>Changer le mot de passe</h2>

    <input id="newPassword" type="password" placeholder="Nouveau mot de passe">
    <input id="confirmPassword" type="password" placeholder="Confirmer le mot de passe">

    <button class="loginBtn" onclick="updatePassword()">
      Modifier le mot de passe
    </button>

    <div class="error" id="resetError"></div>
  </div>
</div>

<div class="login" id="loginPage">
  <div class="box">
    <div class="logo">Meub<span>Luxe</span></div>
    <h2>Admin Room</h2>

    <input id="email" type="email" placeholder="Email">
    <input id="password" type="password" placeholder="Mot de passe">

    <button class="loginBtn" onclick="login()">Se connecter</button>

    <div style="text-align:center;margin-top:12px">
      <button type="button" onclick="forgotPassword()" style="background:none;color:#c89143;padding:5px">
        Mot de passe oublié ?
      </button>
    </div>

    <div class="error" id="error"></div>
  </div>
</div>

<div class="dashboard" id="dashboard">

  <div class="top">
    <h1>Meub<span>Luxe</span> Admin</h1>
    <button class="logout" onclick="logout()">Déconnexion</button>
  </div>

  <div class="card">
    <h2>Vendeurs</h2>
    <div id="vendors">Chargement...</div>
  </div>

</div>

<script>

const SUPABASE_URL =
"https://ewhcyilvyvnxaxyaihbk.supabase.co";

const SUPABASE_KEY =
"sb_publishable_OmKcyY6XK11jx4FgJI1pHw_uENdn4nX";

const client = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY,
  {
    auth:{
      persistSession:true,
      autoRefreshToken:true,
      detectSessionInUrl:true
    }
  }
);

function showResetPage(){
  document.getElementById("loginPage").style.display="none";
  document.getElementById("dashboard").style.display="none";
  document.getElementById("resetPage").style.display="flex";
}

function showLogin(){
  document.getElementById("resetPage").style.display="none";
  document.getElementById("dashboard").style.display="none";
  document.getElementById("loginPage").style.display="flex";
}

client.auth.onAuthStateChange((event,session)=>{
  if(event==="PASSWORD_RECOVERY"){
    showResetPage();
  }
});

if(window.location.hash.includes("access_token=")){
  showResetPage();
}

async function updatePassword(){

  const password=document.getElementById("newPassword").value;
  const confirm=document.getElementById("confirmPassword").value;
  const error=document.getElementById("resetError");

  error.textContent="";

  if(password.length<6){
    error.textContent="Le mot de passe doit contenir au moins 6 caractères.";
    return;
  }

  if(password!==confirm){
    error.textContent="Les mots de passe ne correspondent pas.";
    return;
  }

  const {error:updateError}=await client.auth.updateUser({
    password:password
  });

  if(updateError){
    error.textContent=updateError.message;
    return;
  }

  alert("Mot de passe modifié avec succès.");

  await client.auth.signOut();

  showLogin();
}

async function forgotPassword(){

  const email=document.getElementById("email").value.trim();
  const error=document.getElementById("error");

  error.style.color="#c00";
  error.textContent="";

  if(!email){
    error.textContent="Entre ton email d'abord.";
    return;
  }

  const redirectUrl =
    window.location.origin +
    window.location.pathname;

  const {error:resetError} =
    await client.auth.resetPasswordForEmail(
      email,
      {
        redirectTo:redirectUrl
      }
    );

  if(resetError){
    error.textContent=resetError.message;
    return;
  }

  error.style.color="green";
  error.textContent="Un email de réinitialisation a été envoyé.";
}

async function login(){

  const email=document.getElementById("email").value.trim();
  const password=document.getElementById("password").value;

  const {error}=await client.auth.signInWithPassword({
    email:email,
    password:password
  });

  if(error){
    document.getElementById("error").textContent=
      "Email ou mot de passe incorrect.";
    return;
  }

  showAdmin();
}

function showAdmin(){

  document.getElementById("loginPage").style.display="none";
  document.getElementById("resetPage").style.display="none";
  document.getElementById("dashboard").style.display="block";

  loadVendors();
}

async function loadVendors(){

  const {data,error}=await client
    .from("vendors")
    .select("*")
    .order("created_at",{ascending:false});

  const box=document.getElementById("vendors");

  if(error){
    box.textContent=error.message;
    return;
  }

  if(!data || !data.length){
    box.innerHTML="<p>Aucun vendeur.</p>";
    return;
  }

  box.innerHTML=data.map(v=>`
    <div class="vendor">
      <h3>${v.name || ""}</h3>
      <p>${v.category || ""}</p>
      <p>📍 ${v.city || ""}</p>
      <p>📞 ${v.phone || ""}</p>

      <button
        class="delete"
        onclick="deleteVendor('${v.id}')">
        Supprimer
      </button>
    </div>
  `).join("");
}

async function deleteVendor(id){

  if(!confirm("Supprimer ce vendeur ?")){
    return;
  }

  const {error}=await client
    .from("vendors")
    .delete()
    .eq("id",id);

  if(error){
    alert(error.message);
    return;
  }

  loadVendors();
}

async function logout(){

  await client.auth.signOut();

  location.reload();
}

</script>

</body>
